<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="light dark" />
    <title>Chalk</title>
    <!-- Relative URLs only: the app serves under /<slug>/app/, so a
         root-absolute /styles.css would resolve against the DOMAIN root. -->
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem("chalk.theme");
        if (saved) document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body data-view="list">
    <a class="skip" href="#canvas">Skip to board</a>

    <header class="topbar">
      <div class="topbar__group">
        <a class="wordmark" href="#" title="All boards">
          <span class="wordmark__mark" aria-hidden="true"></span>
          Chalk
        </a>
        <input class="boardname" id="board-name" value="" readonly maxlength="80" aria-label="Board name" hidden />
        <span class="status mono onboard" id="status" data-status="offline" role="status">Offline</span>
      </div>

      <div class="topbar__group">
        <div class="presence onboard" id="presence" aria-live="polite"></div>
        <button class="button button--sm onboard" id="share-button">Share</button>
        <button class="button button--sm onboard" id="export-button">Export</button>
        <button class="iconbutton" id="theme-toggle" title="Switch theme" aria-label="Switch theme">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <path d="M8 .9v1.8M8 13.3v1.8M.9 8h1.8M13.3 8h1.8M2.9 2.9l1.3 1.3M11.8 11.8l1.3 1.3M13.1 2.9l-1.3 1.3M4.2 11.8l-1.3 1.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 9.7A5.8 5.8 0 016.3 2.5a5.8 5.8 0 107.2 7.2z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="account" id="account">
          <button class="account__button" id="account-button" aria-haspopup="true" aria-expanded="false" aria-label="Account"></button>
          <div class="menu menu--right" id="account-menu" hidden>
            <label class="menu__label mono eyebrow" for="name-input">Your name on the board</label>
            <input class="menu__input" id="name-input" maxlength="40" />
            <div class="menu__row">
              <span class="badge mono" id="plan-badge" data-plan="free">Free</span>
              <span class="menu__email" id="account-email"></span>
            </div>
            <div class="menu__rule"></div>
            <a class="menu__item" id="account-upgrade" href="../">Upgrade to Pro</a>
            <a class="menu__item" href="__yard/auth/logout">Sign out</a>
          </div>
        </div>
      </div>
    </header>

    <!-- The board list. Shown when the hash is empty. -->
    <section class="boards" id="boards" hidden>
      <div class="boards__head">
        <h1 class="boards__title">Your boards</h1>
        <button class="button" id="new-board">New board</button>
      </div>
      <div class="boards__list" id="board-list"></div>
    </section>

    <!-- The open board. Shown when the hash names one. -->
    <main class="workspace" id="workspace" hidden>
      <div class="rail" role="toolbar" aria-label="Tools" aria-orientation="vertical">
        <button class="tool" data-tool="select" aria-pressed="true" title="Select (V)" aria-label="Select">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2l10 6-4.5 1L6 13z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
        </button>
        <button class="tool" data-tool="hand" aria-pressed="false" title="Pan (H, or hold space)" aria-label="Pan">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 8V3.5a1 1 0 012 0V7m0-4a1 1 0 012 0v4m0-3a1 1 0 012 0v5.5c0 2.5-2 4.5-4.5 4.5S3 12 3 10.5V6.5a1 1 0 012 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <span class="rail__rule" role="presentation"></span>
        <button class="tool" data-tool="note" aria-pressed="false" title="Sticky note (N)" aria-label="Sticky note">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5h11v7l-4 4h-7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /><path d="M9.5 13.5v-4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" /></svg>
        </button>
        <button class="tool" data-tool="rect" aria-pressed="false" title="Rectangle (R)" aria-label="Rectangle">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <button class="tool" data-tool="ellipse" aria-pressed="false" title="Ellipse (O)" aria-label="Ellipse">
          <svg viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="8" rx="5.5" ry="4.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <button class="tool" data-tool="line" aria-pressed="false" title="Line (L, shift for an arrow)" aria-label="Line">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13L13 3M8 3h5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="tool" data-tool="pen" aria-pressed="false" title="Pen (P)" aria-label="Pen">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 13.5c3-1 2-6 5-7s3.5 4 6.5 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
        <button class="tool" data-tool="text" aria-pressed="false" title="Text (T)" aria-label="Text">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M8 3.5v9M6 12.5h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
        <span class="rail__rule" role="presentation"></span>
        <div class="swatches" role="group" aria-label="Colour">
          <button class="swatch" data-color="yellow" aria-pressed="true" aria-label="Yellow"></button>
          <button class="swatch" data-color="pink" aria-pressed="false" aria-label="Pink"></button>
          <button class="swatch" data-color="blue" aria-pressed="false" aria-label="Blue"></button>
          <button class="swatch" data-color="green" aria-pressed="false" aria-label="Green"></button>
          <button class="swatch" data-color="orange" aria-pressed="false" aria-label="Orange"></button>
          <button class="swatch" data-color="purple" aria-pressed="false" aria-label="Purple"></button>
          <button class="swatch" data-color="grey" aria-pressed="false" aria-label="Grey"></button>
          <button class="swatch" data-color="ink" aria-pressed="false" aria-label="Ink"></button>
        </div>
        <span class="rail__rule" role="presentation"></span>
        <button class="tool" id="undo-button" title="Undo (Cmd/Ctrl+Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4L3 7l3 3M3.5 7H10a3 3 0 010 6H7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="tool" id="redo-button" title="Redo (Shift+Cmd/Ctrl+Z)" aria-label="Redo" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4l3 3-3 3M12.5 7H6a3 3 0 000 6h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <button class="tool" id="delete-button" title="Delete selection (Delete)" aria-label="Delete selection">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5v-2h3v2M4.5 4.5l.7 9h5.6l.7-9" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <span class="rail__spacer"></span>
        <button class="tool" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
        <button class="zoom mono" id="zoom" title="Zoom to fit (1)">100%</button>
        <button class="tool" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
        </button>
      </div>

      <svg class="canvas" id="canvas" tabindex="0" aria-label="Board" role="application"></svg>
      <textarea class="editor" id="editor" hidden aria-label="Edit text" maxlength="2000" spellcheck="false"></textarea>
    </main>

    <div class="sheet" id="share" hidden>
      <div class="sheet__scrim" data-close></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-label="Share this board">
        <div class="sheet__head">
          <span class="mono eyebrow">Share</span>
          <button class="iconbutton" data-close aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </div>
        <label class="toggle">
          <input type="checkbox" id="share-toggle" />
          <span>Anyone with the link can edit</span>
        </label>
        <p class="sheet__note" id="share-note"></p>
        <div class="linkrow">
          <input class="linkrow__field mono" id="share-link" readonly aria-label="Board link" />
          <button class="button" id="share-copy">Copy link</button>
        </div>
        <p class="sheet__note">People still sign in with Yard, so every cursor has a name.</p>
      </div>
    </div>

    <div class="sheet" id="plan" hidden>
      <div class="sheet__scrim" data-close></div>
      <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="plan-title">
        <div class="sheet__head">
          <span class="mono eyebrow">Plan</span>
          <button class="iconbutton" data-close aria-label="Close">
            <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          </button>
        </div>
        <h2 class="sheet__title" id="plan-title"></h2>
        <p class="sheet__copy" id="plan-copy"></p>
        <!-- The landing page is one level up and its buttons carry the tier ids. -->
        <div class="sheet__actions" id="plan-actions">
          <a class="button button--primary" href="../">Start a free trial</a>
          <a class="button" href="../">Upgrade</a>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
